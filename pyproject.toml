[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statarb"
version = "0.3.0"
description = "Survivorship-bias-free US equity statistical-arbitrage research platform"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Amandeep Singh" }]
keywords = ["quantitative-finance", "statistical-arbitrage", "pairs-trading", "delta-lake"]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Investment",
  # Makes an accidental `twine upload` fail loudly. This is a research
  # repository, not a library for distribution.
  "Private :: Do Not Upload",
]

# Core = everything needed to READ the warehouse and RUN research.
# Floors are the versions this was developed against. No upper caps: an upper
# cap on a leaf application creates dependency conflicts it cannot resolve.
dependencies = [
  "polars>=1.43",
  "pyarrow>=25.0",
  "deltalake>=1.6",
  "numpy>=2.5",
  "pandas>=2.2",
  "scikit-learn>=1.7",
  "statsmodels>=0.14",
  "scipy>=1.16",
]

[project.optional-dependencies]
# Office-only. arrow-odbc and pyodbc need a system ODBC driver, which CI has no
# way to install. Keeping them OUT of core is precisely what lets CI install the
# package and test the entire read path on a clean Linux runner.
ingest = ["arrow-odbc>=10.4", "pyodbc>=5.3"]

# WRDS/CRSP access for the second vendor. Separate because `wrds` is the only
# dependency of the legacy CRSP puller, and nothing else needs it.
crsp = ["wrds>=3.2"]

dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",
  "hypothesis>=6.100",
  "ruff>=0.14",
  "mypy>=1.11",
  "pre-commit>=4.0",
  "nbstripout>=0.8",
]

nb = ["jupyterlab>=4.4", "matplotlib>=3.10"]

[project.scripts]
# One entry point with subcommands, replacing bare-script invocation. Bare
# scripts were how the `import config` bug survived: they only worked from one
# specific working directory.
statarb = "statarb.cli.main:main"

# =============================================================================
# PACKAGING
# =============================================================================
# `where = ["src"]` is the whole fix for the old `where = ["."]`, which scanned
# the repository root and would have tried to package the data directories.
# Under a src/ layout nothing outside src/ is packageable, so that class of
# accident is structurally impossible.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"statarb.ingest.factset" = ["sql/**/*.sql"]

# =============================================================================
# PYTEST
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  # Tests needing a live FactSet connection are deselected by default, so the
  # default `pytest` invocation works for anyone, anywhere.
  "-m", "not office",
]
markers = [
  "office: requires a live FactSet SQL Server connection (deselected by default)",
  "slow: takes more than a few seconds",
]

# =============================================================================
# RUFF
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",    # pycodestyle / pyflakes
  "I",              # import sorting
  "UP",             # pyupgrade
  "B",              # bugbear
  "C4",             # comprehensions
  "SIM",            # simplify
  "RET",            # return consistency
  "PTH",            # <- catches the os.path.join(os.getcwd(), ...) family that
                    #    made the legacy code CWD-dependent and unimportable
  "S",              # bandit -- S105/S106 are the lint-level catch for the
                    #    hardcoded-credential problem this repo already had
  "T20",            # no print() outside cli/
  "TRY",            # exception antipatterns
  "PERF",
  "RUF",
]
ignore = [
  "E501",    # line length is enforced by the formatter
  "TRY003",  # long messages inside raise are often the most useful thing there
  "TRY300",
  "S608",    # SQL string building: see the noqa comments at each site
]

[tool.ruff.lint.per-file-ignores]
# Asserts ARE the point of a test file.
"tests/**" = ["S101", "T20"]
# CLIs print; that is their job.
"src/statarb/cli/**" = ["T20"]
# The legacy strategy modules are kept as-is under a structural-only cleanup.
# Listing them here is deliberate: it records that they are known to be
# unmodernised rather than silently exempting them.
"src/statarb/backtest/**" = ["T20", "PTH", "B", "SIM", "RET", "PERF", "TRY", "UP", "E", "F", "W", "RUF"]
"src/statarb/research/**" = ["T20", "PTH", "B", "SIM", "RET", "PERF", "TRY", "UP", "RUF"]
"src/statarb/ingest/crsp/**" = ["T20", "PTH", "B", "SIM", "RET", "TRY", "UP", "RUF"]
"src/statarb/curate/gics_pickle_build.py" = ["T20", "PTH", "RUF"]
"src/statarb/scripts/**" = ["T20", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["statarb"]

# =============================================================================
# MYPY
# =============================================================================
[tool.mypy]
python_version = "3.13"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true

# Strict on the NEW, tested code. The legacy strategy modules are excluded
# rather than globally weakening the settings -- a narrow, documented exception
# beats disabling strictness everywhere.
[[tool.mypy.overrides]]
module = [
  "statarb.backtest.*",
  "statarb.research.*",
  "statarb.ingest.crsp.*",
  "statarb.curate.gics_pickle_build",
  "statarb.scripts.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "deltalake.*", "statsmodels.*", "sklearn.*", "arrow_odbc.*",
  "pyodbc.*", "wrds.*", "scipy.*",
]
ignore_missing_imports = true

# =============================================================================
# COVERAGE
# =============================================================================
[tool.coverage.run]
source = ["statarb"]
omit = [
  # Needs a live ODBC connection to a shared production server; not
  # meaningfully testable in CI. Excluded openly rather than padding the number.
  "*/statarb/ingest/factset/extractor.py",
  "*/statarb/ingest/crsp/*",
  "*/statarb/cli/demo.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
